<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Analytics Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">
                Order Analytics Dashboard
            </span>
        </div>
    </nav>

    <main class="container py-4">

        <!-- Summary -->
        <div class="row mb-4">

            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h6>Total Revenue</h6>
                        <h3 id="totalRevenue">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h6>Pending</h6>
                        <h3 id="pendingCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h6>Shipped</h6>
                        <h3 id="shippedCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h6>Cancelled</h6>
                        <h3 id="cancelledCount">0</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- More Summary -->
        <div class="row mb-4">

            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h5>Highest Value Order</h5>
                        <p id="highestOrder"></p>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h5>All Orders Have Items?</h5>
                        <p id="allHaveItems"></p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Top Customers -->
        <div class="row mb-4">

            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h5>Top 3 Orders</h5>
                        <div id="topOrders"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-body">
                        <h5>Customers Over 150 OMR</h5>
                        <div id="highValueCustomers"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Filter by Status
                        </label>

                        <select
                            id="statusFilter"
                            class="form-select"
                        >
                            <option value="All">All</option>
                            <option value="Pending">Pending</option>
                            <option value="Shipped">Shipped</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Search Customer
                        </label>

                        <input
                            id="customerSearch"
                            type="text"
                            class="form-control"
                            placeholder="Enter customer name"
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label d-block">
                            Discount Preview
                        </label>

                        <button
                            id="discountToggle"
                            class="btn btn-outline-primary"
                            type="button"
                        >
                            Preview 15% Off Everything
                        </button>
                    </div>

                </div>

            </div>
        </div>

        <h2 class="mb-3">
            Orders
        </h2>

        <div
            id="orderList"
            class="row"
        ></div>

    </main>

    <script src="order.js"></script>

</body>

</html>

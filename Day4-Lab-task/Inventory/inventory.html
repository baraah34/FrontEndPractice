<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Inventory Utility</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand">
                Product Inventory Utility
            </span>

        </div>

    </nav>



    <main class="container py-5">


        <!-- Page Title -->

        <div class="mb-4">

            <h1>Product Inventory</h1>

            <p class="text-muted">
                JavaScript Day 4 Lab Task
            </p>

        </div>



        <!-- Summary -->

        <div class="row mb-4">


            <!-- Total Inventory Value -->

            <div class="col-md-6 mb-3">

                <div class="card h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Total Inventory Value
                        </h5>

                        <p
                            id="totalValue"
                            class="fs-3 fw-bold"
                        >
                            0
                        </p>

                    </div>

                </div>

            </div>



            <!-- Low Stock Count -->

            <div class="col-md-6 mb-3">

                <div class="card h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            Low Stock Products
                        </h5>

                        <p
                            id="lowStockCount"
                            class="fs-3 fw-bold"
                        >
                            0
                        </p>

                    </div>

                </div>

            </div>


        </div>



        <!-- Heading + Button -->

        <div
            class="d-flex
                   justify-content-between
                   align-items-center
                   mb-4"
        >

            <h2 class="mb-0">
                Products
            </h2>


            <button
                id="toggleBtn"
                type="button"
                class="btn btn-primary"
            >
                Show Low Stock Only
            </button>

        </div>



        <!-- Product Cards -->

        <div
            id="productList"
            class="row"
        >
        </div>


    </main>



    <!-- JavaScript at the end of body -->

    <script src="inventory.js"></script>


</body>

</html>

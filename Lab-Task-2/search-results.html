<!DOCTYPE html>

<html lang="en">

<head>
    <title>Baraah Store Search Results</title>
</head>

<body>

    <header>

        <h1>Baraah Store</h1>

        <form >

            <label for="search">Search products:</label>

            <input
                type="search"
                id="search"
                name="search"
                placeholder="Search Baraah Store"
            >

            <button type="submit">Search</button>

        </form>

        <nav aria-label="Account navigation">
            <a href="#">Account</a>
            <a href="#">Orders</a>
            <a href="#">Cart</a>

            <br><br>
        </nav>

    </header>
    <main>

        <nav aria-label="Breadcrumb">
            <a href="#">Home</a>
            &gt;  <!--gratter than -->
            <a href="#">Electronics</a>
            &gt;
            <span>Wireless Headphones</span>
        </nav>

        <section>

            <h2>Search Results for Wireless Headphones</h2>

            <p>Showing 1–6 of 24 results</p>

            <form>

                <label for="sort">Sort by:</label>

                <select id="sort" name="sort">
                    <option value="featured">Featured</option>
                    <option value="low-price">Price: Low to High</option>
                    <option value="high-price">Price: High to Low</option>
                    <option value="rating">Best Seller</option>
                </select>

                <button type="submit">Apply</button>

            </form>

        </section>

                <!-- Product filters -->
        <aside>

            <h2>Refine Results</h2>

            <form>

    
                <fieldset>

                    <legend>Brand</legend>

                    <input
                        type="checkbox"
                        id="brand-apple"
                        name="brand"
                        value="apple"
                    >
                    <label for="brand-apple">Airpods</label>

                    <br>

                    <input
                        type="checkbox"
                        id="brand-sonic"
                        name="brand"
                        value="sonic"
                    >
                    <label for="brand-sonic">SonicWave</label>

                    <br>

                    <input
                        type="checkbox"
                        id="brand-aero"
                        name="brand"
                        value="aero"
                    >
                    <label for="brand-aero">AeroSound</label>

                </fieldset>

                <!--  radio buttons -->
                <fieldset>

                    <legend>Minimum Customer Rating</legend>

                    <input
                        type="radio"
                        id="rating-four"
                        name="rating"
                        value="4"
                    >
                    <label for="rating-four">4 stars and above</label>

                    <br>

                    <input
                        type="radio"
                        id="rating-three"
                        name="rating"
                        value="3"
                    >
                    <label for="rating-three">3 stars and above</label>

                    <br>

                    <input
                        type="radio"
                        id="rating-any"
                        name="rating"
                        value="any"
                    >
                    <label for="rating-one"> 1 start </label>

                </fieldset>

                <!-- Price  -->
                <fieldset>

                    <legend>Price Range</legend>

                    <label for="minimum-price">Minimum price:</label>

                    <input
                        type="number"
                        id="minimum-price"
                        name="minimum-price"
                        min="0"
                        placeholder="0"
                    >

                    <br>

                    <label for="maximum-price">Maximum price:</label>

                    <input
                        type="number"
                        id="maximum-price"
                        name="maximum-price"
                        min="0"
                        placeholder="100"
                    >

                </fieldset>

                <button type="submit">Apply Filters</button>
                <button type="reset">Clear Filters</button>

            </form>

        </aside>
